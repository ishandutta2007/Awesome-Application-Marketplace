<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="subGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="35" result="blur" />
    </filter>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.75" stroke-opacity="0.3" />
    </pattern>
  </defs>

  <style>
    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 50px;
      fill: url(#primaryGrad);
      letter-spacing: -1px;
    }
    .subtitle-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      font-size: 19px;
      fill: #cbd5e1;
      letter-spacing: 0.3px;
    }
    .badge-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
      fill: #e2e8f0;
    }
    .flow-line {
      stroke-dasharray: 8 8;
      animation: dashMove 25s linear infinite;
    }
    @keyframes dashMove {
      from { stroke-dashoffset: 0; }
      to { stroke-dashoffset: -500; }
    }
    .pulsing-orb-1 {
      animation: pulseGlow1 8s ease-in-out infinite alternate;
    }
    .pulsing-orb-2 {
      animation: pulseGlow2 10s ease-in-out infinite alternate;
    }
    .floating-card-1 {
      animation: floatCard1 6s ease-in-out infinite alternate;
    }
    .floating-card-2 {
      animation: floatCard2 7s ease-in-out infinite alternate;
    }
    .floating-card-3 {
      animation: floatCard3 6.5s ease-in-out infinite alternate;
    }
    @keyframes pulseGlow1 {
      0% { transform: scale(1) translate(0px, 0px); opacity: 0.35; }
      100% { transform: scale(1.25) translate(40px, -20px); opacity: 0.65; }
    }
    @keyframes pulseGlow2 {
      0% { transform: scale(1) translate(0px, 0px); opacity: 0.3; }
      100% { transform: scale(1.3) translate(-30px, 30px); opacity: 0.6; }
    }
    @keyframes floatCard1 {
      0% { transform: translateY(0px); }
      100% { transform: translateY(-10px); }
    }
    @keyframes floatCard2 {
      0% { transform: translateY(0px); }
      100% { transform: translateY(12px); }
    }
    @keyframes floatCard3 {
      0% { transform: translateY(0px); }
      100% { transform: translateY(-8px); }
    }
  </style>

  <!-- Canvas Background -->
  <rect width="1200" height="420" rx="16" fill="url(#bgGrad)" />
  <rect width="1200" height="420" rx="16" fill="url(#grid)" />

  <!-- Dynamic Glowing Orbs in Background -->
  <g class="pulsing-orb-1">
    <circle cx="180" cy="110" r="140" fill="#38bdf8" filter="url(#softGlow)" opacity="0.4" />
  </g>
  <g class="pulsing-orb-2">
    <circle cx="1020" cy="300" r="160" fill="#818cf8" filter="url(#softGlow)" opacity="0.35" />
  </g>
  <circle cx="600" cy="380" r="110" fill="#c084fc" filter="url(#softGlow)" opacity="0.25" />

  <!-- Animated Ambient Connective Grid Lines -->
  <path class="flow-line" d="M 50 80 Q 300 20 600 80 T 1150 80" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.3" />
  <path class="flow-line" d="M 50 350 Q 400 390 750 340 T 1150 360" fill="none" stroke="#a855f7" stroke-width="1.5" stroke-opacity="0.25" />

  <!-- Background Animated Mini-Cards (Placed to flanking sides so center remains clear) -->
  <g class="floating-card-1" opacity="0.75">
    <rect x="50" y="270" width="160" height="48" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.4" />
    <circle cx="72" cy="294" r="6" fill="#38bdf8" />
    <text x="88" y="299" class="badge-text" fill="#94a3b8">Multi-Vendor</text>
  </g>

  <g class="floating-card-2" opacity="0.75">
    <rect x="990" y="80" width="160" height="48" rx="10" fill="#1e293b" stroke="#818cf8" stroke-width="1" stroke-opacity="0.4" />
    <circle cx="1012" cy="104" r="6" fill="#818cf8" />
    <text x="1028" y="109" class="badge-text" fill="#94a3b8">App Registries</text>
  </g>

  <g class="floating-card-3" opacity="0.75">
    <rect x="980" y="240" width="170" height="48" rx="10" fill="#1e293b" stroke="#c084fc" stroke-width="1" stroke-opacity="0.4" />
    <circle cx="1002" cy="264" r="6" fill="#c084fc" />
    <text x="1018" y="269" class="badge-text" fill="#94a3b8">Vendor Payouts</text>
  </g>

  <!-- Top Pill / Status Tag (Foreground) -->
  <g transform="translate(450, 48)">
    <rect width="300" height="34" rx="17" fill="#1e293b" stroke="#475569" stroke-width="1.2" />
    <circle cx="20" cy="17" r="5" fill="#10b981" />
    <text x="35" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="13" fill="#38bdf8" letter-spacing="0.8">CURATED OPEN ECOSYSTEM</text>
  </g>

  <!-- Core Title & Subtitle (Clear Foreground, unobstructed) -->
  <!-- Subtle dark backdrop scrim behind center text to ensure 100% legibility -->
  <ellipse cx="600" cy="180" rx="460" ry="85" fill="#0b1120" opacity="0.7" filter="url(#softGlow)" />

  <text x="600" y="170" text-anchor="middle" class="title-text" filter="url(#glow)">Awesome Application Marketplace</text>
  <text x="600" y="215" text-anchor="middle" class="subtitle-text">The definitive index of Application Marketplaces, App Stores &amp; Extension Registries</text>
  <text x="600" y="248" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="400" font-size="15" fill="#94a3b8">Multi-Vendor Infrastructure • Enterprise Cloud Marketplaces • Plugin Repositories • Automated Payouts</text>

  <!-- Category Pills (Foreground) -->
  <g transform="translate(190, 310)">
    <!-- Pill 1 -->
    <g transform="translate(0, 0)">
      <rect width="180" height="42" rx="21" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.6" />
      <text x="90" y="26" text-anchor="middle" class="badge-text">⚡ Cloud Marketplaces</text>
    </g>
    <!-- Pill 2 -->
    <g transform="translate(210, 0)">
      <rect width="190" height="42" rx="21" fill="#1e293b" stroke="#818cf8" stroke-width="1.2" stroke-opacity="0.6" />
      <text x="95" y="26" text-anchor="middle" class="badge-text">🛍️ Multi-Vendor Commerce</text>
    </g>
    <!-- Pill 3 -->
    <g transform="translate(430, 0)">
      <rect width="180" height="42" rx="21" fill="#1e293b" stroke="#a855f7" stroke-width="1.2" stroke-opacity="0.6" />
      <text x="90" y="26" text-anchor="middle" class="badge-text">🧩 Extension Registries</text>
    </g>
    <!-- Pill 4 -->
    <g transform="translate(640, 0)">
      <rect width="180" height="42" rx="21" fill="#1e293b" stroke="#ec4899" stroke-width="1.2" stroke-opacity="0.6" />
      <text x="90" y="26" text-anchor="middle" class="badge-text">💳 Vendor Billing &amp; Splits</text>
    </g>
  </g>

  <!-- Border Frame -->
  <rect x="1" y="1" width="1198" height="418" rx="15" fill="none" stroke="#334155" stroke-width="1.5" stroke-opacity="0.6" />
</svg>
